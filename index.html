<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>JQuiz</title>

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/all.min.css">

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Oxygen&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cabin&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Krub:wght@200;300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/media.css">

  <link rel="icon" href="img/favicon.png">
</head>

<body>
  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom fixed-top px-3 d-lg-none">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <!-- Left: Brand -->
      <a href="index.html" class="navbar-brand" id="title">
        <img src="img/logo_small.png" alt="logo">
      </a>

      <!-- Right: Hamburger button -->
      <div class="position-relative">
        <button class="navbar-toggler border-0" type="button" id="menuToggle" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Dropdown menu (appears below the hamburger) -->
        <div id="menuDropdown"
             class="position-absolute bg-white border rounded shadow-sm p-2 d-none"
             style="top: 2.8rem; right: 0; min-width: 12.75rem; z-index: 1050;">

          <!-- Game Modes Dropdown -->
          <div class="dropdown mb-2">
            <button class="btn btn-light w-100 text-start dropdown-toggle" type="button" id="gameModesToggle">
              Game modes
            </button>
            <div id="gameModesMenu" class="bg-white border rounded mt-1 p-1 d-none">
              <button class="btn btn-outline-secondary w-100 mb-1 game-modes-button-eng-to-hir">a → あ</button>
              <button class="btn btn-outline-secondary w-100 game-modes-button-hir-to-eng">あ → a</button>
            </div>
          </div>

          <!-- About -->
          <a href="about.html" class="btn btn-light w-100 text-start">About</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Add spacing so your content isn't hidden under the fixed navbar -->
  <div class="d-lg-none" style="height: 3rem;"></div>

  <div class="container-fluid main d-flex p-0 m-0 min-vh-100 overflow-hidden">
    <!-- Sidebar -->
    <div class="sidebar d-none d-lg-block p-0 m-0 flex-shrink-0 position-relative bg-light">
      <div class="w-100 m-0 pb-2">
        <a href="index.html" class="navbar-brand justify-content-center d-flex" id="title">
          <img src="img/logo.png" alt="logo">
        </a>
      </div>

      <!-- Game modes button -->
      <div class="position-relative w-100">
        <button onclick="gameModesShowToggle()" class="sidebar-form sidebar-button-actions dropbtn w-100 btn btn-outline-secondary">
          Game modes
        </button>
        <div id="myDropdown" class="dropdown-content w-100" style="top: 0; left: 100%">
          <button class="sidebar-form sidebar-button-actions justify-content-center w-100 btn btn-outline-secondary game-modes-button-eng-to-hir">
            a -> あ
          </button>
          <button class="sidebar-form sidebar-button-actions justify-content-center w-100 btn btn-outline-secondary game-modes-button-hir-to-eng">
            あ -> a
          </button>
        </div>
      </div>

      <a href="about.html" class="sidebar-form sidebar-button-actions w-100 btn btn-outline-secondary">
        About
      </a>
    </div>

    <!-- Main content -->
    <div class="flex-grow-1 d-flex flex-column p-0 mx-0" style="margin-top: 1rem" id="gamefield">
      <div class="row g-0">
        <!-- Controls for large screens -->
        <div class="d-none d-lg-block col-lg-3" style="margin-top: 6rem">
          <div class="row g-0 mb-2">
            <div class="col">
              <div class="d-flex justify-content-center task-title">Task</div>
              <div class="d-flex justify-content-center">
                <span class="container basic-form task-question"></span>
              </div>
            </div>
          </div>

          <div class="row g-0 mb-2">
            <div class="col">
              <div class="d-flex justify-content-center task-title">Previous Task</div>
              <div class="d-flex justify-content-center">
                <span class="basic-form previous-task-question"></span>
                <span class="basic-form previous-task-answer"></span>
              </div>
            </div>
          </div>

          <div class="row g-0">
            <div class="col">
              <div class="d-flex justify-content-center task-title">Stats</div>
              <div class="d-flex justify-content-center">
                <span class="basic-form stats-tile" id="attempts"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Grid -->
        <div class="col-12 col-lg-5 d-flex flex-column">
          <div class="text-center" id="gamefield-title">Choose the correct translation</div>
          <div class="grid flex-grow-1"></div>
        </div>

        <!-- Empty -->
        <div class="d-none d-lg-flex col-lg-4"></div>

        <!-- Controls for small screens -->
        <div class="d-lg-none col-12" style="margin-top: 1rem">
          <div class="row g-0">
            <div class="col-4">
              <div class="d-flex justify-content-center task-title">Previous Task</div>
              <div class="d-flex justify-content-center">
                <span class="basic-form previous-task-question"></span>
                <span class="basic-form previous-task-answer"></span>
              </div>
            </div>

            <div class="col-4">
              <div class="d-flex justify-content-center task-title">Task</div>
              <div class="d-flex justify-content-center">
                <span class="container basic-form task-question"></span>
              </div>
            </div>

            <div class="col-4">
              <div class="d-flex justify-content-center task-title">Stats</div>
              <div class="d-flex justify-content-center">
                <span class="basic-form stats-tile"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
